name: Mydentify Public API
description: >-
  Public, keyless REST API for Mydentify — a permanent product directory with weekly
  community-signaled product leaderboards. The OpenAPI 3.1 contract covers intent-based product
  discovery, the curated startup/SaaS/AI directory catalog with Directory Score and link-type
  metadata, a portable product-category taxonomy mapped to G2/Capterra/Product Hunt, and a
  diagnostic-first product submission workflow: a non-destructive dry run, an idempotency-keyed
  durable import with a resumable SSE event stream, an AI-readiness rubric report, duplicate
  resolution, editorial manual review and backlink-verified publication. Mydentify also ships an
  unusually complete agent-native discovery surface — an APIs.json index, an RFC 9727 API
  Catalog, site-wide and per-resource llms.txt, an ai.txt usage policy, robots.txt Content
  Signals, and three published agentskills.io skills.
